<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">PiX Agent architecture</title>
  <desc id="desc">The PiX runtime from user task through repository retrieval, tool calling, verification, bounded repair and dashboard trace output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#090b14"/>
      <stop offset="0.62" stop-color="#0d1226"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6b96"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>

  <g opacity="0.16" stroke="#3b4b78" stroke-width="1">
    <path d="M0 90H1600M0 180H1600M0 270H1600M0 360H1600M0 450H1600M0 540H1600M0 630H1600M0 720H1600M0 810H1600M0 900H1600M0 990H1600"/>
    <path d="M90 0V1080M180 0V1080M270 0V1080M360 0V1080M450 0V1080M540 0V1080M630 0V1080M720 0V1080M810 0V1080M900 0V1080M990 0V1080M1080 0V1080M1170 0V1080M1260 0V1080M1350 0V1080M1440 0V1080M1530 0V1080"/>
  </g>
  <circle cx="1470" cy="120" r="190" fill="#60a5fa" opacity="0.07"/>
  <circle cx="120" cy="980" r="220" fill="#a78bfa" opacity="0.06"/>

  <text x="80" y="92" font-family="Inter, system-ui, sans-serif" font-size="43" font-weight="700" fill="#ffffff" letter-spacing="0">PiX Agent Architecture</text>
  <text x="80" y="138" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#8ea2d0">One bounded runtime: plan, retrieve, act, verify, repair, commit, observe</text>

  <!-- Main pipeline nodes -->
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(40 210)">
      <rect width="210" height="150" rx="10" fill="#101525" stroke="#2a3554"/>
      <text x="20" y="34" font-size="14" fill="#60a5fa" font-weight="700">USER TASK</text>
      <text x="20" y="60" font-size="12" fill="#64748b">CLI / FastAPI</text>
      <text x="20" y="96" font-size="14" fill="#e8f0ff">Analyze this project</text>
      <text x="20" y="120" font-size="14" fill="#e8f0ff">and add JWT login</text>
    </g>

    <g transform="translate(330 180)">
      <rect width="400" height="220" rx="12" fill="#111730" stroke="#3a4e85"/>
      <text x="24" y="37" font-size="20" font-weight="700" fill="#ffffff">PiX Agent</text>
      <text x="24" y="61" font-size="13" fill="#8ea2d0">AgentExecutor</text>
      <rect x="24" y="82" width="176" height="52" rx="8" fill="#17384f"/>
      <text x="36" y="105" font-size="13" fill="#7dd3fc">Repository Analysis</text>
      <text x="36" y="123" font-size="10" fill="#64748b">language / framework / test</text>
      <rect x="214" y="82" width="162" height="52" rx="8" fill="#2b1d33"/>
      <text x="226" y="105" font-size="13" fill="#d8b4fe">Planner</text>
      <text x="226" y="123" font-size="10" fill="#64748b">structured JSON plan</text>
      <rect x="24" y="146" width="176" height="52" rx="8" fill="#101525" stroke="#2a3554"/>
      <text x="36" y="169" font-size="13" fill="#9db0d6">Context Manager</text>
      <text x="36" y="187" font-size="10" fill="#64748b">token budget + compression</text>
      <rect x="214" y="146" width="162" height="52" rx="8" fill="#232d16"/>
      <text x="226" y="169" font-size="13" fill="#bef264">Agent Loop</text>
      <text x="226" y="187" font-size="10" fill="#64748b">reason / act / observe</text>
    </g>

    <g transform="translate(800 210)">
      <rect width="280" height="150" rx="10" fill="#0d2b24" stroke="#27654d"/>
      <text x="22" y="34" font-size="15" fill="#34d399" font-weight="700">REPOSITORY RETRIEVAL</text>
      <text x="22" y="63" font-size="13" fill="#a7f3d0">RepositoryAnalyzer</text>
      <text x="22" y="88" font-size="13" fill="#a7f3d0">RepositoryIndexer</text>
      <text x="22" y="113" font-size="13" fill="#a7f3d0">RepositoryRetriever</text>
      <text x="22" y="135" font-size="11" fill="#86efac">index + semantic top-K</text>
    </g>

    <g transform="translate(1160 180)">
      <rect width="260" height="220" rx="12" fill="#0c1122" stroke="#2a3554"/>
      <text x="20" y="37" font-size="15" fill="#60a5fa" font-weight="700">TOOL CALLING</text>
      <text x="20" y="59" font-size="11" fill="#64748b">ToolRegistry + MCP</text>
      <g font-size="11">
        <rect x="20" y="74" width="106" height="30" rx="7" fill="#17384f"/>
        <text x="27" y="94" fill="#7dd3fc">read_file</text>
        <rect x="134" y="74" width="106" height="30" rx="7" fill="#17384f"/>
        <text x="141" y="94" fill="#7dd3fc">write_file</text>
        <rect x="20" y="112" width="106" height="30" rx="7" fill="#17384f"/>
        <text x="27" y="132" fill="#7dd3fc">search_code</text>
        <rect x="134" y="112" width="106" height="30" rx="7" fill="#17384f"/>
        <text x="141" y="132" fill="#7dd3fc">run_shell</text>
        <rect x="20" y="150" width="106" height="30" rx="7" fill="#243216"/>
        <text x="27" y="170" fill="#bef264">git_diff</text>
        <rect x="134" y="150" width="106" height="30" rx="7" fill="#243216"/>
        <text x="141" y="170" fill="#bef264">git_commit</text>
      </g>
      <text x="20" y="207" font-size="10" fill="#64748b">workspace sandbox only</text>
    </g>

    <g transform="translate(1450 210)">
      <rect width="130" height="150" rx="10" fill="#0d2b24" stroke="#27654d"/>
      <text x="14" y="34" font-size="13" fill="#34d399" font-weight="700">VERIFY</text>
      <text x="14" y="65" font-size="11" fill="#a7f3d0">pytest</text>
      <text x="14" y="86" font-size="11" fill="#a7f3d0">npm test</text>
      <text x="14" y="107" font-size="11" fill="#86efac">lint</text>
      <text x="14" y="133" font-size="10" fill="#86efac">real exit code</text>
    </g>
  </g>

  <!-- Main pipeline arrows -->
  <g stroke="#5b6b96" stroke-width="3" fill="none">
    <path d="M250 285H330" marker-end="url(#arrow)"/>
    <path d="M730 285H800" marker-end="url(#arrow)"/>
    <path d="M1080 285H1160" marker-end="url(#arrow)"/>
    <path d="M1420 285H1450" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8ea2d0">
    <text x="286" y="272">task</text>
    <text x="760" y="272">workspace</text>
    <text x="1112" y="272">top-K code</text>
    <text x="1430" y="272">final answer</text>
  </g>

  <!-- Verification branch point -->
  <path d="M1515 360 L1515 470" fill="none" stroke="#5b6b96" stroke-width="3"/>

  <!-- Autonomous repair loop -->
  <path d="M1515 470 L730 470 L730 400 L540 400" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowAccent)"/>
  <text x="850" y="452" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#d8b4fe">AUTONOMOUS REPAIR · bounded fix attempts · failure output re-enters the loop</text>

  <!-- Pass path to commit -->
  <path d="M1515 470 L1515 620" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1531" y="500" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#34d399">passed</text>
  <text x="1425" y="437" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#d8b4fe">failed</text>

  <!-- Git commit node -->
  <g transform="translate(1450 610)" font-family="Inter, system-ui, sans-serif">
    <rect width="130" height="90" rx="9" fill="#232d16" stroke="#657c3c"/>
    <text x="65" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#bef264">GIT COMMIT</text>
    <text x="65" y="53" text-anchor="middle" font-size="11" fill="#d9f99d">green change</text>
    <text x="65" y="72" text-anchor="middle" font-size="11" fill="#d9f99d">git_commit</text>
  </g>

  <!-- Dashboard / trace node -->
  <g transform="translate(1160 780)" font-family="Inter, system-ui, sans-serif">
    <rect width="420" height="230" rx="12" fill="#101525" stroke="#3a4e85"/>
    <text x="22" y="37" font-size="16" font-weight="700" fill="#c4b5fd">DASHBOARD / TRACE</text>
    <text x="22" y="59" font-size="12" fill="#64748b">FastAPI · Next.js</text>
    <g font-size="11">
      <rect x="22" y="76" width="176" height="32" rx="7" fill="#111730" stroke="#2a3554"/>
      <text x="32" y="97" fill="#9db0d6">SQLite sessions</text>
      <rect x="222" y="76" width="176" height="32" rx="7" fill="#111730" stroke="#2a3554"/>
      <text x="232" y="97" fill="#9db0d6">redacted trace events</text>
      <rect x="22" y="118" width="176" height="32" rx="7" fill="#111730" stroke="#2a3554"/>
      <text x="32" y="139" fill="#9db0d6">token usage</text>
      <rect x="222" y="118" width="176" height="32" rx="7" fill="#111730" stroke="#2a3554"/>
      <text x="232" y="139" fill="#9db0d6">SSE live stream</text>
    </g>
    <text x="22" y="184" font-size="12" fill="#8ea2d0">Every event is redacted before persistence.</text>
    <text x="22" y="208" font-size="12" fill="#8ea2d0">Cost stays null until a known price model exists.</text>
  </g>

  <!-- Commit to dashboard -->
  <path d="M1515 710 L1515 780" fill="none" stroke="#5b6b96" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Tracer path -->
  <path d="M410 400 L410 620 L1225 620 L1225 780" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrowAccent)"/>
  <text x="770" y="610" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#c4b5fd">Tracer → SQLite</text>

  <g transform="translate(80 1015)">
    <text font-family="JetBrains Mono, monospace" font-size="16" fill="#8ea2d0">Plan · Reason · Act · Observe · Verify · Commit</text>
  </g>
</svg>
