<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PiX Agent autonomous software engineering flow</title>
  <desc id="desc">A dark developer-tool diagram from user task through LLM decisions, tools, verification and commit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#090b14"/>
      <stop offset="0.6" stop-color="#0d1226"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#3b4b78" stroke-width="1">
    <path d="M0 90H1600M0 180H1600M0 270H1600M0 360H1600M0 450H1600M0 540H1600M0 630H1600M0 720H1600M0 810H1600"/>
    <path d="M90 0V900M180 0V900M270 0V900M360 0V900M450 0V900M540 0V900M630 0V900M720 0V900M810 0V900M900 0V900M990 0V900M1080 0V900M1170 0V900M1260 0V900M1350 0V900M1440 0V900M1530 0V900"/>
  </g>
  <circle cx="1450" cy="120" r="180" fill="#60a5fa" opacity="0.08"/>
  <circle cx="150" cy="770" r="210" fill="#a78bfa" opacity="0.08"/>

  <text x="100" y="90" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="0">PiX Agent</text>
  <text x="100" y="140" font-family="Inter, system-ui, sans-serif" font-size="25" fill="#8ea2d0">Autonomous Software Engineering Runtime</text>

  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(80 300)">
      <rect width="220" height="78" rx="10" fill="#101525" stroke="#2a3554"/>
      <text x="20" y="34" font-size="15" fill="#60a5fa" font-weight="700">USER TASK</text>
      <text x="20" y="59" font-size="14" fill="#9db0d6">Add JWT login</text>
      <text x="110" y="44" text-anchor="middle" font-size="26" fill="#9db0d6">↓</text>
    </g>

    <g transform="translate(430 270)">
      <rect width="420" height="132" rx="12" fill="#111730" stroke="#3a4e85"/>
      <text x="24" y="38" font-size="18" font-weight="700" fill="#e8f0ff">Agent Runtime</text>
      <text x="24" y="70" font-size="14" fill="#b3c2e2">Context Budget · Tool Registry · Planner</text>
      <rect x="24" y="88" width="120" height="26" rx="6" fill="#60a5fa" opacity="0.18"/>
      <text x="32" y="106" font-size="12" fill="#93c5fd">LLM Decision</text>
      <text x="190" y="70" font-size="13" fill="#64748b">⟶</text>
      <rect x="210" y="50" width="90" height="26" rx="6" fill="#a78bfa" opacity="0.16"/>
      <text x="218" y="68" font-size="12" fill="#c4b5fd">Observation</text>
    </g>

    <g transform="translate(320 570)">
      <rect width="650" height="210" rx="14" fill="#0c1122" stroke="#2a3554"/>
      <text x="26" y="34" font-size="16" fill="#8ea2d0">TOOLS</text>
      <g font-size="14">
        <rect x="26" y="52" width="132" height="44" rx="8" fill="#17384f"/>
        <text x="92" y="80" text-anchor="middle" fill="#7dd3fc">read_file</text>
        <rect x="176" y="52" width="132" height="44" rx="8" fill="#17384f"/>
        <text x="242" y="80" text-anchor="middle" fill="#7dd3fc">write_file</text>
        <rect x="326" y="52" width="132" height="44" rx="8" fill="#17384f"/>
        <text x="392" y="80" text-anchor="middle" fill="#7dd3fc">search_code</text>
        <rect x="476" y="52" width="132" height="44" rx="8" fill="#17384f"/>
        <text x="542" y="80" text-anchor="middle" fill="#7dd3fc">run_shell</text>
        <rect x="26" y="116" width="132" height="44" rx="8" fill="#243216"/>
        <text x="92" y="144" text-anchor="middle" fill="#bef264">git_diff</text>
        <rect x="176" y="116" width="132" height="44" rx="8" fill="#243216"/>
        <text x="242" y="144" text-anchor="middle" fill="#bef264">git_commit</text>
        <rect x="326" y="116" width="282" height="44" rx="8" fill="#2b1d33"/>
        <text x="467" y="144" text-anchor="middle" fill="#d8b4fe">sandboxed workspace only</text>
      </g>
    </g>

    <g transform="translate(1040 340)">
      <rect width="300" height="72" rx="10" fill="#0d2b24" stroke="#27654d"/>
      <text x="22" y="35" font-size="16" fill="#34d399" font-weight="700">Verification</text>
      <text x="22" y="58" font-size="13" fill="#86efac">pytest · npm test · lint</text>
    </g>
    <g transform="translate(1040 470)">
      <rect width="300" height="72" rx="10" fill="#232d16" stroke="#657c3c"/>
      <text x="22" y="35" font-size="16" fill="#bef264" font-weight="700">Git Commit</text>
      <text x="22" y="58" font-size="13" fill="#d9f99d">green change → commit</text>
    </g>
    <g transform="translate(1380 250)">
      <rect width="140" height="150" rx="10" fill="#101525" stroke="#2a3554"/>
      <text x="70" y="40" text-anchor="middle" font-size="16" fill="#c4b5fd">Trace</text>
      <text x="70" y="74" text-anchor="middle" font-size="24" fill="#60a5fa">⏱</text>
      <text x="70" y="112" text-anchor="middle" font-size="12" fill="#64748b">SQLite events</text>
      <text x="70" y="134" text-anchor="middle" font-size="12" fill="#64748b">token usage</text>
    </g>

    <path d="M300 420 C370 420 370 380 430 380" fill="none" stroke="#5b6b96" stroke-width="3"/>
    <path d="M645 420 C730 420 730 580 780 580" fill="none" stroke="#5b6b96" stroke-width="3"/>
    <path d="M970 450 C1000 450 1000 376 1040 376" fill="none" stroke="#5b6b96" stroke-width="3"/>
    <path d="M1190 412 L1190 470" fill="none" stroke="#5b6b96" stroke-width="3"/>
    <path d="M1160 580 C1160 620 1390 620 1450 620" fill="none" stroke="#5b6b96" stroke-width="3" opacity="0.45"/>
  </g>

  <g transform="translate(82 830)">
    <text font-family="JetBrains Mono, monospace" font-size="17" fill="#8ea2d0">Plan · Reason · Act · Observe · Verify · Commit</text>
  </g>
</svg>
