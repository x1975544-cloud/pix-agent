services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PIX_API_TOKEN: ${PIX_API_TOKEN:-}
      PIX_WORKSPACE: /workspace
      PIX_DATABASE_URL: sqlite:////app/data/pix-agent.db
      PIX_SKILLS_DIR: /app/skills
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace
      - pix-data:/app/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN:-}
    depends_on:
      - api

volumes:
  pix-data:
